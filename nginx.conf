# =============================================================================
#  nginx-config voor het HA legacy dashboard
#  (wordt in de container op /etc/nginx/conf.d/default.conf gezet)
#
#  Naast de statische pagina is er één schrijfbaar adres: /config.json.
#  Dat bestand staat in het volume /config, zodat de configuratie bewaard
#  blijft terwijl de container zelf wegwerpbaar is.
# =============================================================================
server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;
    charset utf-8;

    # Belangrijk op iOS 9: Safari cachet HTML agressief. Zonder deze regel kan
    # je na een nieuwe build een oud dashboard blijven zien. Geldt ook voor
    # config.json, dat na het opslaan meteen zichtbaar moet zijn.
    expires -1;

    # Kleine hardening; verder bewust niets (geen logging-ruis, geen extra's).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;

    # -------------------------------------------------------------------------
    #  Dashboard
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # runtime.json wordt bij elke containerstart gemaakt. Bewust een eigen
    # locatie: als het bestand ontbreekt moet er een eerlijke 404 komen en niet
    # stiekem index.html (de pagina leest dit bestand als JSON).
    location = /runtime.json {
    }

    # -------------------------------------------------------------------------
    #  Configuratiebestand
    #
    #  Lezen (GET) mag iedereen die het dashboard kan laden; schrijven kan
    #  alleen met PUT (WebDAV-module). DELETE en POST zijn geblokkeerd.
    #
    #  "root /config" betekent hier: het bestand /config/config.json.
    #  client_body_temp_path staat bewust op dezelfde schijf als het doelbestand:
    #  de WebDAV-module schrijft de inhoud eerst naar een tijdelijk bestand en
    #  hernoemt dat; over twee verschillende schijven (containerlaag <-> volume)
    #  mislukt die rename.
    #
    #  Zonder de mount op /config blijft dit adres 404/500 geven en gebruikt het
    #  dashboard automatisch localStorage (zie runtime.json).
    # -------------------------------------------------------------------------
    location = /config.json {
        root /config;
        dav_methods PUT;
        dav_access user:rw group:rw all:r;
        client_body_temp_path /config/.tmp;
        client_max_body_size 512k;
        limit_except GET PUT {
            deny all;
        }
    }

    # Geen directory-listing, geen dotfiles.
    location ~ /\. {
        deny all;
    }
}
